<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator & Converter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --op-btn: #0284c7;
      --op-btn-hover: #0369a1;
      --num-btn: #334155;
      --num-btn-hover: #475569;
      --action-btn: #475569;
      --action-btn-hover: #64748b;
      --eq-btn: #10b981;
      --eq-btn-hover: #059669;
      --clear-btn: #ef4444;
      --clear-btn-hover: #dc2626;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(255, 255, 255, 0.02);
    }

    .panel {
      display: none;
      padding: 20px;
    }

    .panel.active {
      display: block;
    }

    /* Calculator Display */
    .calc-screen {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
      text-align: right;
      position: relative;
    }

    .calc-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 20px;
      margin-bottom: 6px;
    }

    .calc-mem-indicator {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      visibility: hidden;
    }

    .calc-mem-indicator.visible {
      visibility: visible;
    }

    .calc-history-line {
      font-size: 0.9rem;
      color: var(--text-muted);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .calc-history-line::-webkit-scrollbar {
      display: none;
    }

    .calc-main-display {
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      overflow-x: auto;
      white-space: nowrap;
      word-break: break-all;
      scrollbar-width: none;
    }

    .calc-main-display::-webkit-scrollbar {
      display: none;
    }

    /* Keypad Grid */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .mem-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      padding: 14px 0;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-mem {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 8px 0;
    }

    .btn-mem:hover {
      background: #334155;
      color: var(--text);
    }

    .btn-num {
      background: var(--num-btn);
    }

    .btn-num:hover {
      background: var(--num-btn-hover);
    }

    .btn-action {
      background: var(--action-btn);
      color: #cbd5e1;
    }

    .btn-action:hover {
      background: var(--action-btn-hover);
      color: #fff;
    }

    .btn-op {
      background: var(--op-btn);
    }

    .btn-op:hover {
      background: var(--op-btn-hover);
    }

    .btn-eq {
      background: var(--eq-btn);
      grid-column: span 1;
    }

    .btn-eq:hover {
      background: var(--eq-btn-hover);
    }

    .btn-clear {
      background: var(--clear-btn);
    }

    .btn-clear:hover {
      background: var(--clear-btn-hover);
    }

    /* History section */
    .history-card {
      margin-top: 18px;
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-header h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .btn-text:hover {
      color: var(--accent-hover);
    }

    .history-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .history-item:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
    }

    .history-item .hist-expr {
      color: var(--text-muted);
    }

    .history-item .hist-res {
      font-weight: 600;
      color: var(--accent);
    }

    .empty-state {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 10px 0;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #0284c7;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="2" width="16" height="20" rx="2"></rect>
        <line x1="8" y1="6" x2="16" y2="6"></line>
        <line x1="16" y1="14" x2="16" y2="18"></line>
        <line x1="8" y1="10" x2="8" y2="10.01"></line>
        <line x1="12" y1="10" x2="12" y2="10.01"></line>
        <line x1="16" y1="10" x2="16" y2="10.01"></line>
        <line x1="8" y1="14" x2="8" y2="14.01"></line>
        <line x1="12" y1="14" x2="12" y2="14.01"></line>
        <line x1="8" y1="18" x2="8" y2="18.01"></line>
        <line x1="12" y1="18" x2="12" y2="18.01"></line>
      </svg>
      Calculator
    </h1>
    <p>Simple, fast, and interactive</p>
  </header>

  <main class="app-container">
    <div class="panel active" id="calc-panel">
      <div class="calc-screen" id="calc-screen" title="Click to copy result">
        <div class="calc-meta">
          <span class="calc-mem-indicator" id="mem-indicator">M</span>
          <span class="calc-history-line" id="expr-line"></span>
        </div>
        <div class="calc-main-display" id="display">0</div>
      </div>

      <div class="mem-row">
        <button class="btn btn-mem" data-action="mc">MC</button>
        <button class="btn btn-mem" data-action="mr">MR</button>
        <button class="btn btn-mem" data-action="m-plus">M+</button>
        <button class="btn btn-mem" data-action="m-minus">M-</button>
      </div>

      <div class="keypad-grid">
        <button class="btn btn-clear" data-action="clear">C</button>
        <button class="btn btn-action" data-action="del">DEL</button>
        <button class="btn btn-action" data-val="(">(</button>
        <button class="btn btn-action" data-val=")">)</button>

        <button class="btn btn-action" data-action="sqrt">√</button>
        <button class="btn btn-action" data-val="^">^</button>
        <button class="btn btn-action" data-val="%">%</button>
        <button class="btn btn-op" data-val="/">÷</button>

        <button class="btn btn-num" data-val="7">7</button>
        <button class="btn btn-num" data-val="8">8</button>
        <button class="btn btn-num" data-val="9">9</button>
        <button class="btn btn-op" data-val="*">×</button>

        <button class="btn btn-num" data-val="4">4</button>
        <button class="btn btn-num" data-val="5">5</button>
        <button class="btn btn-num" data-val="6">6</button>
        <button class="btn btn-op" data-val="-">−</button>

        <button class="btn btn-num" data-val="1">1</button>
        <button class="btn btn-num" data-val="2">2</button>
        <button class="btn btn-num" data-val="3">3</button>
        <button class="btn btn-op" data-val="+">+</button>

        <button class="btn btn-action" data-action="neg">±</button>
        <button class="btn btn-num" data-val="0">0</button>
        <button class="btn btn-num" data-val=".">.</button>
        <button class="btn btn-eq" data-action="equals">=</button>
      </div>

      <div class="history-card">
        <div class="history-header">
          <h3>Recent Calculations</h3>
          <button class="btn-text" id="clear-history">Clear</button>
        </div>
        <ul class="history-list" id="history-list">
          <li class="empty-state">No calculations yet</li>
        </ul>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    (function () {
      let currentExpr = "";
      let justCalculated = false;
      let memoryValue = 0;
      let historyItems = [];

      const display = document.getElementById("display");
      const exprLine = document.getElementById("expr-line");
      const memIndicator = document.getElementById("mem-indicator");
      const historyList = document.getElementById("history-list");
      const clearHistoryBtn = document.getElementById("clear-history");
      const toast = document.getElementById("toast");
      const screen = document.getElementById("calc-screen");

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function updateDisplay() {
        display.textContent = currentExpr || "0";
      }

      function setExpr(expr) {
        currentExpr = expr;
        updateDisplay();
      }

      function appendValue(val) {
        if (justCalculated) {
          if (/[0-9.]/.test(val)) {
            currentExpr = "";
          }
          justCalculated = false;
        }

        if (val === ".") {
          const parts = currentExpr.split(/[\+\-\*\/\^\(\)\%]/);
          const lastPart = parts[parts.length - 1];
          if (lastPart.includes(".")) return;
          if (lastPart === "" || currentExpr === "") {
            currentExpr += "0.";
            updateDisplay();
            return;
          }
        }

        currentExpr += val;
        updateDisplay();
      }

      function handleClear() {
        currentExpr = "";
        exprLine.textContent = "";
        justCalculated = false;
        updateDisplay();
      }

      function handleDelete() {
        if (justCalculated) {
          handleClear();
          return;
        }
        currentExpr = currentExpr.slice(0, -1);
        updateDisplay();
      }

      function toggleNegate() {
        if (!currentExpr || currentExpr === "0") return;
        if (currentExpr.startsWith("-(")) {
          currentExpr = currentExpr.slice(2, -1);
        } else if (currentExpr.startsWith("-")) {
          currentExpr = currentExpr.slice(1);
        } else {
          currentExpr = "-(" + currentExpr + ")";
        }
        updateDisplay();
      }

      function addSqrt() {
        if (justCalculated) {
          currentExpr = "sqrt(" + currentExpr + ")";
          justCalculated = false;
        } else if (currentExpr === "" || /[\+\-\*\/\^]$/.test(currentExpr)) {
          currentExpr += "sqrt(";
        } else {
          currentExpr = "sqrt(" + currentExpr + ")";
        }
        updateDisplay();
      }

      async function evaluateExpression() {
        if (!currentExpr) return;
        const expressionToEval = currentExpr;
        exprLine.textContent = expressionToEval + " =";

        try {
          const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ expression: expressionToEval }),
          });
          const data = await res.json();
          if (data.ok) {
            const formatted = Number.isInteger(data.result)
              ? data.result.toString()
              : Number(data.result.toFixed(8)).toString();
            currentExpr = formatted;
            updateDisplay();
            justCalculated = true;
            addHistory(expressionToEval, formatted);
          } else {
            display.textContent = data.error || "Error";
            justCalculated = true;
          }
        } catch (err) {
          display.textContent = "Error";
          justCalculated = true;
        }
      }

      function addHistory(expr, res) {
        historyItems.unshift({ expr, res });
        if (historyItems.length > 20) historyItems.pop();
        renderHistory();
      }

      function renderHistory() {
        if (historyItems.length === 0) {
          historyList.innerHTML = '<li class="empty-state">No calculations yet</li>';
          return;
        }
        historyList.innerHTML = "";
        historyItems.forEach((item) => {
          const li = document.createElement("li");
          li.className = "history-item";
          li.innerHTML = `<span class="hist-expr">${item.expr}</span><span class="hist-res">= ${item.res}</span>`;
          li.addEventListener("click", () => {
            currentExpr = item.res;
            exprLine.textContent = item.expr + " =";
            justCalculated = true;
            updateDisplay();
          });
          historyList.appendChild(li);
        });
      }

      clearHistoryBtn.addEventListener("click", () => {
        historyItems = [];
        renderHistory();
        showToast("History cleared");
      });

      // Memory buttons
      function handleMemory(action) {
        const val = parseFloat(display.textContent) || 0;
        switch (action) {
          case "mc":
            memoryValue = 0;
            memIndicator.classList.remove("visible");
            showToast("Memory Cleared");
            break;
          case "mr":
            currentExpr = memoryValue.toString();
            updateDisplay();
            justCalculated = true;
            break;
          case "m-plus":
            memoryValue += val;
            memIndicator.classList.add("visible");
            showToast("Added to Memory");
            break;
          case "m-minus":
            memoryValue -= val;
            memIndicator.classList.add("visible");
            showToast("Subtracted from Memory");
            break;
        }
      }

      // Button clicks
      document.querySelectorAll(".btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const val = btn.dataset.val;
          const action = btn.dataset.action;

          if (val !== undefined) {
            appendValue(val);
          } else if (action) {
            switch (action) {
              case "clear":
                handleClear();
                break;
              case "del":
                handleDelete();
                break;
              case "equals":
                evaluateExpression();
                break;
              case "neg":
                toggleNegate();
                break;
              case "sqrt":
                addSqrt();
                break;
              case "mc":
              case "mr":
              case "m-plus":
              case "m-minus":
                handleMemory(action);
                break;
            }
          }
        });
      });

      // Copy result on screen click
      screen.addEventListener("click", () => {
        const text = display.textContent;
        if (text && text !== "0" && text !== "Error") {
          navigator.clipboard.writeText(text).then(() => {
            showToast("Copied to clipboard!");
          }).catch(() => {});
        }
      });

      // Keyboard navigation
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

        if (e.key >= "0" && e.key <= "9") {
          appendValue(e.key);
        } else if (["+", "-", "*", "/", "^", "%", "(", ")"].includes(e.key)) {
          appendValue(e.key);
        } else if (e.key === ".") {
          appendValue(".");
        } else if (e.key === "Enter" || e.key === "=") {
          e.preventDefault();
          evaluateExpression();
        } else if (e.key === "Backspace") {
          handleDelete();
        } else if (e.key === "Escape") {
          handleClear();
        }
      });
    })();
  </script>
</body>
</html>
